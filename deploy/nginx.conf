# 表情包工坊 —— Nginx 站点配置示例
# 用法：拷到 /etc/nginx/conf.d/meme-studio.conf，把 <接口地址> 换成真实地址后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/meme-studio;
    index index.html;
    client_max_body_size 20m;

    # 页面只用同源 /api，真实接口地址只出现在这里
    location /api/ {
        proxy_pass http://<接口地址>/;          # 注意结尾斜杠：/api/memes/keys -> /memes/keys
        proxy_set_header Host <接口地址>;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;                # 模板总览图需要 30s+
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
